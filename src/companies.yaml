# Source registry for the job-alert poller.
#
# Only companies with a confirmed public JSON API are listed here — no HTML
# scraping or browser automation. Companies without a discoverable API are
# simply out of scope.
#
# `enabled: false` entries have their platform identified but the exact
# endpoint/token unconfirmed — flip to enabled once you've found it via
# browser devtools (Network tab, filter XHR/Fetch, search a role).

